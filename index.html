<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Android CCTV</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="top-bar">
        <h1>Android CCTV</h1>
        <span id="connectionStatus">Offline</span>
    </header>

    <main>

        <section class="mode-selector">

            <button id="cameraModeButton">
                📷 Camera
            </button>

            <button id="viewerModeButton">
                👁️ Viewer
            </button>

        </section>


        <!-- CAMERA MODE -->

        <section id="cameraMode" class="mode">

            <h2>Camera Device</h2>

            <p>
                This device will provide the live camera feed.
            </p>

            <video
                id="localVideo"
                autoplay
                playsinline
                muted
            ></video>

            <button
                id="startCameraButton"
                class="primary-button"
            >
                📷 Start Camera
            </button>

            <button
                id="createOfferButton"
                class="primary-button"
                disabled
            >
                Create Connection
            </button>

            <h3>Connection Code</h3>

            <textarea
                id="offerOutput"
                readonly
                placeholder="Connection information will appear here..."
            ></textarea>

            <button
                id="copyOfferButton"
                disabled
            >
                Copy Connection Code
            </button>

            <h3>Viewer Response</h3>

            <textarea
                id="answerInput"
                placeholder="Paste the viewer response here..."
            ></textarea>

            <button
                id="connectCameraButton"
                disabled
            >
                Connect Viewer
            </button>

        </section>


        <!-- VIEWER MODE -->

        <section
            id="viewerMode"
            class="mode hidden"
        >

            <h2>Viewer</h2>

            <p>
                Watch the remote Android camera here.
            </p>

            <video
                id="remoteVideo"
                autoplay
                playsinline
                controls
            ></video>

            <h3>Camera Connection Code</h3>

            <textarea
                id="offerInput"
                placeholder="Paste the camera connection code here..."
            ></textarea>

            <button
                id="createAnswerButton"
                class="primary-button"
            >
                Connect to Camera
            </button>

            <h3>Viewer Response</h3>

            <textarea
                id="answerOutput"
                readonly
                placeholder="Viewer response will appear here..."
            ></textarea>

            <button
                id="copyAnswerButton"
                disabled
            >
                Copy Viewer Response
            </button>

        </section>

    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
